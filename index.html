<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaPulse - AI Language Tutor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-64 border-r border-slate-800 bg-slate-900/50 p-6 flex flex-col justify-between">
    <div>
      <div class="flex items-center gap-3 mb-8">
        <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/30">
          <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
            LinguaPulse
          </h1>
          <span class="text-xs text-indigo-400 font-semibold">AI Powered</span>
        </div>
      </div>

      <nav class="space-y-2">
        <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 shadow-sm">
          <i data-lucide="message-square" class="w-5 h-5"></i>
          AI Practice Studio
        </button>
      </nav>
    </div>

    <div class="p-4 bg-slate-800/40 rounded-2xl border border-slate-700/50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center font-bold text-indigo-300">
          <i data-lucide="user" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="text-sm font-semibold">Learner</div>
          <div class="text-xs text-slate-400">Level: <span class="text-indigo-400 font-bold">B2</span></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="flex-1 flex flex-col bg-slate-900/20">
    <header class="h-16 border-b border-slate-800/80 px-8 flex items-center justify-between">
      <h2 class="text-lg font-bold text-slate-200">Interactive AI Scenario Lab</h2>
      <select id="levelSelect" class="bg-slate-800 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 outline-none">
        <option value="A1">CEFR A1</option>
        <option value="A2">CEFR A2</option>
        <option value="B1">CEFR B1</option>
        <option value="B2" selected>CEFR B2</option>
        <option value="C1">CEFR C1</option>
      </select>
    </header>

    <div class="flex-1 overflow-hidden p-8 flex justify-center">
      <div class="w-full max-w-4xl h-full flex flex-col bg-slate-900/60 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- CHAT BOX -->
        <div id="chatBox" class="flex-1 overflow-y-auto p-6 space-y-4">
          <div class="flex justify-start">
            <div class="max-w-[80%] p-4 rounded-2xl bg-slate-800/80 text-slate-200 rounded-bl-none border border-slate-700/60 text-sm">
              Hello! Ready for today's dynamic scenario practice? What would you like to talk about today?
            </div>
          </div>
        </div>

        <!-- INPUT BAR -->
        <div class="p-4 border-t border-slate-800 bg-slate-900/80 flex gap-3">
          <input
            type="text"
            id="userInput"
            placeholder="Type your response in English..."
            class="flex-1 bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-200"
          />
          <button
            id="sendBtn"
            class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-medium flex items-center justify-center shadow-lg shadow-indigo-600/20"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </div>

      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // CLAUDE API KEY'INIZI BURAYA YAZIN
    const ANTHROPIC_API_KEY = "BURAYA_CLAUDE_API_KEYINI_YAZ";

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const levelSelect = document.getElementById('levelSelect');

    let history = [
      { role: 'assistant', content: "Hello! Ready for today's dynamic scenario practice? What would you like to talk about today?" }
    ];

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // User Message UI
      chatBox.innerHTML += `
        <div class="flex justify-end">
          <div class="max-w-[80%] p-4 rounded-2xl bg-indigo-600 text-white rounded-br-none shadow-md text-sm">
            ${text}
          </div>
        </div>
      `;
      userInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      history.push({ role: 'user', content: text });

      // Loading UI
      const loadingId = 'loading-' + Date.now();
      chatBox.innerHTML += `
        <div id="${loadingId}" class="flex justify-start">
          <div class="bg-slate-800/80 text-slate-400 p-4 rounded-2xl rounded-bl-none text-xs flex items-center gap-2 border border-slate-700/60">
            Claude düşünüyor...
          </div>
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': ANTHROPIC_API_KEY,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'dangerously-allow-browser': 'true'
          },
          body: JSON.stringify({
            model: 'claude-3-5-sonnet-20240620',
            max_tokens: 1000,
            system: `You are an elite English language tutor. Level: ${levelSelect.value}. Keep responses natural. Correct grammar errors at the end.`,
            messages: history
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (data.content && data.content[0].text) {
          const aiReply = data.content[0].text;
          history.push({ role: 'assistant', content: aiReply });

          chatBox.innerHTML += `
            <div class="flex justify-start">
              <div class="max-w-[80%] p-4 rounded-2xl bg-slate-800/80 text-slate-200 rounded-bl-none border border-slate-700/60 text-sm whitespace-pre-wrap">
                ${aiReply}
              </div>
            </div>
          `;
        } else {
          chatBox.innerHTML += `<div class="text-red-400 text-xs text-center">API Hatası veya Key Yanlış.</div>`;
        }
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        chatBox.innerHTML += `<div class="text-red-400 text-xs text-center">Bağlantı hatası oluştu.</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
